[package]
name = "steam-account-switcher"
description = "Steam account switcher desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "accountswitcher"
repository.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { workspace = true }

[features]
# ! Without it Tauri compiles in development mode and loads `devUrl` instead of the embedded interface, required for release builds.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
steam-core = { path = "../steam-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
zeroize = { workspace = true }
ts-rs = { workspace = true }
sys-locale = "0.3"
# ! Same crate `tauri-plugin-updater` already uses internally to verify the installer
# artifacts: reused here to re-verify the portable executable before it replaces itself.
minisign-verify = "0.3"
base64 = "0.22"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }


# ! Gives the window its app id / WM class on Linux, so the desktop pairs it
# with the installed .desktop entry and shows the application icon.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
glib = "0.18"
gio = "0.18"

[lib]
name = "steam_account_switcher_lib"
path = "src/lib.rs"

[[bin]]
name = "accountswitcher"
path = "src/main.rs"
