name: release
run-name: release v${{ inputs.version }}

# ! Starting it by hand publishes the version typed in the input: the workflow
# writes it into the project, tags it, then builds and signs the Linux and
# Windows bundles and creates the GitHub release the application updates from.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (for example 0.2.0)"
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # ! Tags tell whether the requested version is already published.
          fetch-depth: 0

      - name: Check the version
        id: check
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 .github/bump-version.py --check-next "$RELEASE_VERSION"
          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Write it into the project
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: python3 .github/bump-version.py "$RELEASE_VERSION"

      - name: Tag the release
        id: tag
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          version="v$RELEASE_VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore(release): $version"
          fi

          git tag -a "$version" -m "$version - Steam Account Switcher"
          # ! Only the tag is pushed: the release commit stays off `main`, so
          # the branch keeps exactly the history written by hand.
          git push origin "refs/tags/$version"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles appimage,rpm,deb -- --locked
          - platform: windows-latest
            args: --bundles nsis -- --locked
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Install WebKitGTK and packaging tools
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf rpm file

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install the interface dependencies
        run: npm ci

      # ! The Paraglide message modules are generated and git-ignored, so a fresh
      # checkout has none until the interface is built once.
      - name: Generate the interface messages
        run: npm run build

      - name: Check the interface
        run: npm run verify

      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-audit

      - name: Audit Rust dependencies
        run: cargo audit

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: "true"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.version.outputs.version }}
          releaseName: "v${{ needs.version.outputs.version }} - Steam Account Switcher"
          releaseBody: "Download the installer for your system. Existing installations update themselves from the in-app button."
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          # ! latest.json already carries every signature: the .sig files are not published.
          uploadUpdaterSignatures: false
          args: ${{ matrix.args }}

      - name: Attach the portable Windows executable
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp target/release/accountswitcher.exe SteamAccountSwitcher-portable.exe
          gh release upload "v${{ needs.version.outputs.version }}" SteamAccountSwitcher-portable.exe --clobber

  finalize:
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: v${{ needs.version.outputs.version }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      # ! The job holding the updater signing key is the one place in this workflow
      # that ran an unpinned `npx --yes`: it now runs the exact version this release
      # was checked out at, already resolved and locked by `npm ci`.
      - name: Install the interface dependencies
        run: npm ci --ignore-scripts

      # ! tauri-action points latest.json at API URLs limited to 60 requests an hour per IP, and
      # the NSIS-only manifest has no entry a portable Windows copy could self-update from: both
      # are fixed here, before the release goes public.
      - name: Point latest.json at the public downloads and sign the portable copy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          tag="v$RELEASE_VERSION"
          base="https://github.com/$GH_REPO/releases/download/$tag"
          gh release download "$tag" --pattern latest.json --pattern SteamAccountSwitcher-portable.exe --dir draft
          gh release view "$tag" --json assets \
            --jq '[.assets[] | {key: (.apiUrl | split("/") | last), value: .name}] | from_entries' \
            > draft/names.json
          jq --slurpfile names draft/names.json --arg base "$base/" \
            '.platforms |= map_values(.url = ($base + ($names[0][.url | split("/") | last] // error("no asset for " + .url))))' \
            draft/latest.json > draft/rewritten.json

          # ! The portable copy ships no Tauri bundle the CLI signs on its own during `publish`:
          # it is signed here instead, against the same version, so the app can verify it like
          # every other platform. `--app-version` is what `requireSignedVersion` checks against.
          npx --no-install tauri signer sign --app-version "$RELEASE_VERSION" draft/SteamAccountSwitcher-portable.exe
          jq --arg url "$base/SteamAccountSwitcher-portable.exe" \
            --arg signature "$(cat draft/SteamAccountSwitcher-portable.exe.sig)" \
            '.platforms["windows-x86_64-portable"] = {url: $url, signature: $signature}' \
            draft/rewritten.json > latest.json

          # ! The two builds rewrite latest.json in turn: one finishing at the same time as the
          # other can drop its system.
          jq -e '.platforms | has("linux-x86_64") and has("windows-x86_64") and has("windows-x86_64-portable")' latest.json > /dev/null \
            || { echo "::error::latest.json lacks a platform: $(jq -c '.platforms | keys' latest.json)"; exit 1; }
          gh release upload "$tag" latest.json --clobber

      - name: Publish the complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: gh release edit "v$RELEASE_VERSION" --draft=false

  # ! A failed build must not burn its version number: the tag and the draft release
  # are removed so the same version can be published again after the fix.
  # ! After a failed run, start a NEW run for the same version: "Re-run failed
  # jobs" reuses the first attempt's outputs, but the tag it checks out was
  # withdrawn below, so every publish job fails at checkout.
  withdraw:
    needs: [version, publish, finalize]
    # ! Only a run that created its own tag may remove it: a refused version must
    # never delete the release already published under that number.
    if: failure() && needs.version.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove the tag and the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release delete "v$RELEASE_VERSION" --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/v$RELEASE_VERSION" || true
