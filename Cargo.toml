[workspace]
resolver = "2"
members = ["steam-core", "src-tauri"]

[workspace.package]
version = "1.0.2"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/SunkwiBOT/steam-account-switcher"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
